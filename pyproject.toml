[project]
name = "rss-to-transcript"
version = "0.1.0"
description = "Download and locally transcribe recent podcast episodes from an RSS feed"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.26.8",
]

[project.scripts]
rss-to-transcript = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rss_to_transcript", "main.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
